name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Actions sets CI=true, which makes react-scripts treat
      # lint warnings as errors and run the test suite once instead of
      # entering watch mode.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
